# Only this fixed model-provider operation has outbound access. The agent
# container itself is attached solely to the internal network.
server {
    listen 443 ssl;
    server_name llm-gateway;
    ssl_certificate /etc/nginx/evaluation-tls/ca.crt;
    ssl_certificate_key /etc/nginx/evaluation-tls/ca.key;
    access_log off;
    client_max_body_size 256k;
    location = /v1/chat/completions {
        limit_except POST { deny all; }
        proxy_pass https://api.openai.com/v1/chat/completions;
        proxy_set_header Host api.openai.com;
        proxy_ssl_server_name on;
        proxy_ssl_name api.openai.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/cert.pem;
        proxy_read_timeout 120s;
        proxy_redirect off;
    }
    location / { return 404; }
}
